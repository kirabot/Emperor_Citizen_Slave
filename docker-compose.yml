services:
  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 2456
      FRONTEND_ORIGIN: "http://euclidean.ddns.net:25565"  # exact origin
    ports:
      - "2456:2456"

  web:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://euclidean.ddns.net:2456"
    ports:
      - "25565:80"
